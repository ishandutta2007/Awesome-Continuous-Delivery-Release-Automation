<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Flow Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 18px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    
    /* Animations */
    @keyframes pulseParticle {
      0% { offset-distance: 0%; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { offset-distance: 100%; opacity: 0; }
    }
    
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    @keyframes rotateGear {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .pulse-line {
      stroke-dasharray: 8 12;
      animation: dash 30s linear infinite;
    }

    @keyframes dash {
      to { stroke-dashoffset: -1000; }
    }

    .floating-node-1 { animation: floatCard 6s ease-in-out infinite; }
    .floating-node-2 { animation: floatCard 7s ease-in-out 1s infinite; }
    .floating-node-3 { animation: floatCard 8s ease-in-out 2s infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="350" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Dynamic Background Pipeline Wave Lines (Behind Foreground Text) -->
  <g opacity="0.3">
    <path d="M -50 280 Q 300 200 600 280 T 1250 220" fill="none" stroke="url(#lineGrad)" stroke-width="4" class="pulse-line" />
    <path d="M -50 100 Q 400 180 800 100 T 1250 160" fill="none" stroke="url(#lineGrad)" stroke-width="3" class="pulse-line" />
  </g>

  <!-- Background Animated Tech Pills / Nodes (Positioned low/sides so foreground text stays completely clear) -->
  <g class="floating-node-1" transform="translate(80, 250)">
    <rect width="180" height="46" rx="23" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="28" cy="23" r="10" fill="#38bdf8" opacity="0.8"/>
    <text x="50" y="28" class="badge-text">⚡ GitOps &amp; CI/CD</text>
  </g>

  <g class="floating-node-2" transform="translate(510, 250)">
    <rect width="210" height="46" rx="23" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.5" />
    <circle cx="28" cy="23" r="10" fill="#818cf8" opacity="0.8"/>
    <text x="50" y="28" class="badge-text">🔄 Release Automation</text>
  </g>

  <g class="floating-node-3" transform="translate(930, 250)">
    <rect width="190" height="46" rx="23" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.5" />
    <circle cx="28" cy="23" r="10" fill="#c084fc" opacity="0.8"/>
    <text x="50" y="28" class="badge-text">📦 Progressive Delivery</text>
  </g>

  <!-- Main Foreground Title & Subtitle (Unblocked & Highly Readable) -->
  <g transform="translate(600, 110)" text-anchor="middle">
    <!-- Top Category Pill -->
    <rect x="-140" y="-75" width="280" height="32" rx="16" fill="#1e293b" stroke="#6366f1" stroke-width="1"/>
    <text x="0" y="-54" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#a5b4fc" letter-spacing="1.5">CURATED DEVOPS ECOSYSTEM</text>
    
    <!-- Title -->
    <text x="0" y="10" class="title" filter="url(#glow)">Awesome Continuous Delivery</text>
    <text x="0" y="55" class="title" fill="#a5b4fc">&amp; Release Automation</text>
    
    <!-- Subtitle -->
    <text x="0" y="105" class="subtitle">The Definitive Directory of CI/CD Platforms, GitOps Engine &amp; Release Orchestration Tools</text>
  </g>
</svg>
